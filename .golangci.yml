version: "2"

linters:
  default: standard
  disable:
    - errcheck
  enable:
    - bodyclose      # Checks whether HTTP response body is closed successfully
    - cyclop         # Checks function and package cyclomatic complexity
    - dupl           # Detects duplicate fragments of code
    - durationcheck  # Check for two durations multiplied together
    - errname        # Checks name rules for error values and types
    - errorlint      # Find code that can cause problems with error wrapping
    - misspell       # Finds commonly misspelled English words
    - nakedret       # Checks that functions with naked returns are not longer than a maximum size
    - nilerr         # Find the code that returns nil even if it checks that the error is not nil
    - noctx          # Detects function and method with missing usage of context.Context
    - nolintlint     # Reports ill-formed or insufficient nolint directives
    - predeclared    # Find declarations that shadow Go's predeclared identifiers
    - reassign       # Checks that package variables are not reassigned
    - revive         # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - rowserrcheck   # Checks whether Rows.Err of rows is checked successfully
    - sqlclosecheck  # Checks that sql.Rows, sql.Stmt, sqlx.NamedStmt, pgx.Query are closed
    - staticcheck    # Staticcheck does what staticcheck can
    - testifylint    # Checks usage of github.com/stretchr/testify
    - unconvert      # Remove unnecessary type conversions
    - usestdlibvars  # A linter that detect the possibility to use variables/constants from the Go standard library
    - usetesting     # Reports uses of functions with replacement inside the testing package
    - wastedassign   # Finds wasted assignment statements

  settings:
    dupl:
      threshold: 100 # tokens, not lines

    errcheck:
      check-type-assertions: true
      verbose: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    nakedret:
      max-func-lines: 0

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      enable-default-rules: true
      rules:
        - name: unused-parameter
          arguments:
            - allow-regex: "^(_|ctx$|t$)"
        - name: var-naming
          arguments:
          - ["API", "ID", "IDS"] # Allow list
          - [] # Deny list
        - name: exported
          arguments:
            - "disable-checks-on-constants"
            - "disable-checks-on-types"
            - "disable-checks-on-variables"

    testifylint:
      disable:
        - require-error

  exclusions:
    # Don't check generated code, ie. matches the regexp:
    # ^// Code generated .* DO NOT EDIT\.$
    # See: https://pkg.go.dev/cmd/go#hdr-Generate_Go_files_by_processing_source
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  #new-from-merge-base: origin/develop

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:  # equivalent to `gofumpt --extra` in the CLI
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true

output:
  sort-order:
    - file
    - linter
    - severity
