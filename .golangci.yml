version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - decorder
    - durationcheck
    - errname
    - errorlint
    - intrange
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
        - name: unused-parameter
        - name: early-return
    staticcheck:
      checks:
        - all
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
